# The launcher without podman: tests on three Pythons and two OSes, then the wheel installed in a clean venv and asked
# what it would run.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: The wheel works on its own
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/hypdmz --version
          /tmp/w/bin/hypdmz example
          HYPDMZ_STATE_DIR=/tmp/state /tmp/w/bin/hypdmz init
          HYPDMZ_STATE_DIR=/tmp/state /tmp/w/bin/hypdmz policy
          HYPDMZ_STATE_DIR=/tmp/state /tmp/w/bin/hypdmz up --dry-run | grep -q -- "--read-only"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
