# Tag v<version> → run the tests, build the sdist and wheel, test the wheel in a clean venv, publish to PyPI with
# trusted publishing (no API token: the "pypi" environment and a pending publisher for this repository are configured
# on pypi.org), and attach the files to a GitHub release.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m build
      - name: The tag matches the package version
        run: test "v$(python -c 'import hypdmz; print(hypdmz.__version__)')" = "${GITHUB_REF_NAME}"
      - name: The wheel works on its own
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/hypdmz --version
          HYPDMZ_STATE_DIR=/tmp/state /tmp/w/bin/hypdmz init
          HYPDMZ_STATE_DIR=/tmp/state /tmp/w/bin/hypdmz up --dry-run | grep -q -- "--read-only"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
